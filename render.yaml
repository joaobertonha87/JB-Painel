services:
  - type: web
    name: meu-painel-jb
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: VAPID_SUBJECT
        value: mailto:seu-email@exemplo.com
      - key: TZ
        value: America/Sao_Paulo
