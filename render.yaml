services:
  - type: web
    name: meu-painel-jb
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: meu-painel-jb-db
          property: connectionString
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: VAPID_SUBJECT
        value: mailto:seu-email@exemplo.com
      - key: TZ
        value: America/Sao_Paulo

databases:
  - name: meu-painel-jb-db
    databaseName: paineljb
    user: paineljb
