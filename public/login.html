<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b0a">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <title>Entrar • Meu Painel JB</title>
</head>
<body class="login-body">
  <main class="login-shell">
    <div class="login-logo">JB</div>
    <small>MEU PAINEL</small>
    <h1>Sua rotina na palma da mão.</h1>
    <p>Entre com sua senha pessoal para acessar agenda, alunos e conteúdos.</p>
    <form id="login-form">
      <label>Senha pessoal<input id="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required></label>
      <button class="primary" type="submit">Entrar no aplicativo</button>
      <span id="login-error" class="login-error"></span>
    </form>
  </main>
  <script>
    document.querySelector("#login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = event.currentTarget.querySelector("button");
      const error = document.querySelector("#login-error");
      button.disabled = true; button.textContent = "Entrando…"; error.textContent = "";
      const response = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: document.querySelector("#password").value }) });
      if (response.ok) location.replace("/");
      else { error.textContent = "Senha incorreta. Tente novamente."; button.disabled = false; button.textContent = "Entrar no aplicativo"; }
    });
  </script>
</body>
</html>
